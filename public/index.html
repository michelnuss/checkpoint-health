<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Checkpoint Health, live demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bar:#0F2E24; --bar-ink:#E6EFEA; --bar-muted:#93ADA2;
  --chat-bg:#FAF9F5; --chat-ink:#141413; --chat-muted:#73726C; --chat-line:#E8E6DC; --user-bubble:#F0EEE6; --rail:#F5F4EE; --accent:#D97757; --accent-ink:#C6613F;
  --c-bg:#F4F1E8; --c-panel:#FFFFFF; --c-ink:#1C1B1A; --c-muted:#706E6B; --c-line:#E8E5DF; --c-soft:#F0ECE1; /* clinical paper */
  --green:#1C5741; --green-ink:#14402F; --green-soft:#E1EFE7;
  --red:#B3372A; --red-soft:#F9E6E2;
  --amber:#8A5A00; --amber-soft:#F7EDD6;
  --chat-font:"Inter", ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
  --serif:"Source Serif 4", ui-serif, Georgia, Cambria, serif;
  --c-font:"IBM Plex Sans", system-ui, -apple-system, Segoe UI, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--chat-font);color:var(--chat-ink);background:var(--c-bg);display:flex;flex-direction:column;height:100vh;overflow:hidden}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--green);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* Presenter bar */
.bar{background:var(--bar);color:var(--bar-ink);display:flex;align-items:center;gap:14px;padding:8px 16px;font-family:var(--c-font);font-size:13.5px;flex-wrap:wrap;flex:none}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;letter-spacing:.01em}
.brand svg{flex:none}
.bar .note{color:var(--bar-muted);font-size:13px}
.bar .spacer{flex:1}
.ctl{display:flex;align-items:center;gap:8px;color:var(--bar-muted)}
.ctl select{background:#183F32;color:var(--bar-ink);border:1px solid #2A5646;border-radius:6px;padding:6px 8px;font:inherit}
.seg{display:inline-flex;border:1px solid #2A5646;border-radius:7px;overflow:hidden}
.seg button{background:transparent;color:var(--bar-muted);border:0;padding:6px 12px}
.seg button[aria-pressed="true"]{background:#2A5646;color:#fff}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.btn-bar{background:#E6EFEA;color:var(--bar);border:0;border-radius:7px;padding:7px 14px;font-weight:600}
.btn-bar.ghost{background:transparent;color:var(--bar-ink);border:1px solid #2A5646}
.livedot{width:8px;height:8px;border-radius:50%;background:#6B7F77;display:inline-block}
.livedot.on{background:#5FD39A}

/* Split */
.split{flex:1;display:grid;grid-template-columns:minmax(380px,44fr) minmax(480px,56fr);min-height:0;overflow:hidden}
@media (max-width:1050px){.split{grid-template-columns:1fr}}

/* ---------- CHAT (Claude-style) ---------- */
.chat{background:var(--chat-bg);display:grid;grid-template-columns:52px 1fr;min-height:0;border-right:1px solid var(--c-line);height:100%;min-height:0}
.rail{background:var(--rail);border-right:1px solid var(--chat-line);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:6px}
.rail button{width:34px;height:34px;border-radius:8px;border:0;background:transparent;color:#5E5D59;display:grid;place-items:center}
.rail button:hover{background:#E9E7DE}
.rail .grow{flex:1}
.rail .me{width:30px;height:30px;border-radius:50%;background:#3D3D3A;color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center}
.cmain{display:flex;flex-direction:column;min-height:0;min-width:0;height:100%}
.chat-head{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;height:52px}
.ctitle{font-size:14px;color:var(--chat-ink);display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctitle:hover{background:#F0EEE6}
.head-r{display:flex;gap:8px;align-items:center}
.demo-badge{font-size:11.5px;color:var(--chat-muted);border:1px solid var(--chat-line);border-radius:6px;padding:3px 7px;background:#fff}
.sharebtn{font-size:13px;border:1px solid var(--chat-line);background:#fff;border-radius:8px;padding:6px 12px;color:var(--chat-ink)}
.thread{flex:1;overflow-y:auto;scroll-behavior:smooth}
.col{max-width:680px;margin:0 auto;padding:18px 24px 12px}
.empty{text-align:center;margin-top:20vh}
.empty strong{display:block;font-family:var(--serif);font-weight:400;font-size:34px;color:#3D3D3A;letter-spacing:-.01em;margin-bottom:10px}
.empty span{color:var(--chat-muted);font-size:14px}
.msg{margin:0 0 20px;line-height:1.65;font-size:16px}
.msg.user{margin-left:auto;background:var(--user-bubble);padding:10px 16px;border-radius:14px;width:fit-content;max-width:85%;font-size:15px;line-height:1.55}
.msg.user.secure{background:#F0EEE6;color:var(--chat-ink);display:flex;gap:10px;align-items:flex-start}
.msg.user.secure small{display:block;color:var(--chat-muted);font-size:12.5px}
.msg.ai{font-family:var(--serif);font-size:16.5px;color:#1F1E1D}
.msg.ai p{margin:0 0 12px}
.msg.ai p:last-child{margin:0}
.msg.ai ul,.msg.ai ol{margin:0 0 12px;padding-left:22px}.msg.ai li{margin:0 0 4px}.msg.ai li:last-child{margin:0}
.msg.sys{font-size:13px;color:var(--chat-muted);text-align:center}
.thinking{display:inline-flex;align-items:center;gap:8px;color:var(--chat-muted);font-family:var(--chat-font);font-size:14px}
.pulse{width:14px;height:14px;border-radius:50%;background:var(--accent);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.6);opacity:.55}50%{transform:scale(1);opacity:1}}
details.tool{margin:0 0 14px;font-size:13.5px;border:1px solid var(--chat-line);border-radius:10px;background:#fff;max-width:100%}
details.tool summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center;padding:9px 12px;color:#3D3D3A}
details.tool summary::-webkit-details-marker{display:none}
details.tool summary .ico{width:20px;height:20px;border-radius:5px;background:var(--green);display:grid;place-items:center;flex:none}
details.tool summary b{font-weight:500}
details.tool summary .fn{color:var(--chat-muted)}
details.tool summary .chev{margin-left:auto;transition:transform .15s;color:var(--chat-muted)}
details.tool[open] summary .chev{transform:rotate(90deg)}
details.tool .io{border-top:1px solid var(--chat-line);padding:10px 12px}
details.tool .io h5{margin:0 0 4px;font-size:11.5px;font-weight:500;color:var(--chat-muted)}
details.tool pre{margin:0 0 10px;background:#FAF9F5;border:1px solid var(--chat-line);border-radius:8px;padding:9px;font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;max-height:200px;overflow:auto;color:#3D3D3A}

/* widgets (rendered inline by the Checkpoint connector) */
.w{margin:0 0 22px}
.w.done{opacity:.55;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid #DEDCD1;background:#fff;color:var(--chat-ink);border-radius:10px;padding:8px 13px;font-size:14px;transition:background .12s,border-color .12s}
.chip:hover{background:#F5F4EE;border-color:#CFCCBF}
.chip[aria-pressed="true"]{background:#141413;border-color:#141413;color:#fff}
.chip.demo{position:relative}
.chip.demo::after{content:"";position:absolute;top:-3px;right:-3px;width:7px;height:7px;border-radius:50%;background:#7FB89C}
.w .hint{font-size:12.5px;color:var(--chat-muted);margin-top:8px}
.w .go{margin-top:10px;background:#141413;color:#fff;border:0;border-radius:10px;padding:8px 16px;font-size:14px}
.w .go:disabled{opacity:.3;cursor:not-allowed}
.card{border:1px solid var(--chat-line);border-radius:14px;overflow:hidden;background:#fff}
.cardhead{display:flex;align-items:center;gap:8px;padding:9px 16px;font-size:12.5px;color:var(--chat-muted);border-bottom:1px solid var(--chat-line);background:#FDFDFB}
.cardhead .ico{width:16px;height:16px;border-radius:4px;background:var(--green);display:grid;place-items:center}
.clin{display:grid;grid-template-columns:40px 1fr auto;gap:12px;padding:14px 16px;border-top:1px solid var(--chat-line);align-items:center;text-align:left;background:#fff;width:100%;border-left:0;border-right:0;border-bottom:0;color:inherit}
.cardhead + .clin{border-top:0}
button.clin:hover{background:#FAF9F5}
.clin.off{opacity:.5;cursor:default}
.clin.picked{background:#F0EEE6}
.avatar{width:40px;height:40px;border-radius:50%;background:#E3ECE7;color:var(--green-ink);display:grid;place-items:center;font-weight:600;font-size:14px;font-family:var(--chat-font)}
.clin .nm{font-weight:600;font-size:15px}
.clin .meta{font-size:13px;color:var(--chat-muted);line-height:1.45}
.clin .price{text-align:right;font-size:18px;font-weight:600}
.clin .price small{display:block;font-size:12px;font-weight:400;color:var(--chat-muted)}
.cardfoot{padding:9px 16px;font-size:12px;color:var(--chat-muted);background:#FDFDFB;border-top:1px solid var(--chat-line)}
.secure{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.secure .field{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;border:1px solid #DEDCD1;border-radius:10px;padding:0 6px 0 11px;background:#fff}
.secure .field:focus-within{border-color:var(--green);box-shadow:0 0 0 3px rgba(28,87,65,.12)}
.secure .field input{flex:1;min-width:0;border:0;outline:none;padding:10px 0;font:inherit;font-size:15px;background:transparent;letter-spacing:.06em}
.secure .field input[type="password"]{letter-spacing:.18em}
.secure .field input::placeholder{letter-spacing:normal}
.secure .lock{display:grid;place-items:center;flex:none}
.secure .eye{border:0;background:transparent;color:var(--chat-muted);font-size:12.5px;padding:6px 6px;border-radius:6px}
.secure .eye:hover{background:#F5F4EE}
.secure .send{background:var(--green);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:500}
.lockline{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--green);margin-top:8px}
.ghost{background:transparent;border:1px dashed #CFCCBF;color:var(--chat-muted);border-radius:8px;padding:6px 12px;font-size:13px}
.consent{padding:16px}
.consent h4{margin:0 0 2px;font-size:15px}
.consent .sum{font-size:13.5px;color:var(--chat-muted);margin-bottom:12px}
.consent label{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45;padding:6px 0}
.consent input{margin-top:3px;accent-color:var(--green);width:16px;height:16px}
.pay{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--chat-line);margin-top:10px;padding-top:12px;font-size:14px}
.pay .go{margin:0;background:var(--green);white-space:nowrap}
.alert{border:1px solid #E7B9B1;background:var(--red-soft);border-radius:14px;padding:14px 16px;font-family:var(--chat-font)}
.alert h4{margin:0 0 6px;color:var(--red);font-size:15px}
.alert ul{margin:8px 0 0;padding:0;list-style:none}
.alert li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid #EDCFC9;font-size:14px}
.alert li span{color:var(--chat-muted);font-size:13px;text-align:right}
.shield{border:1px solid #CFDAD4;background:#F4F8F6;border-radius:12px;padding:10px 14px;font-size:13.5px;color:var(--green-ink);display:flex;gap:10px}
.drmsg{border:1px solid #CFE0D6;background:#F5FAF7;border-radius:14px;padding:14px 16px;margin:0 0 20px}
.drmsg .from{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.drmsg .from b{font-size:14.5px}
.drmsg .from span{display:block;font-size:12.5px;color:var(--chat-muted)}
.drmsg p{margin:0;line-height:1.6;font-size:15px;white-space:pre-wrap}
.drmsg .rx{margin-top:10px;font-size:13px;color:var(--green);border-top:1px solid #DCE9E1;padding-top:8px}
.composer{padding:6px 24px 14px}
.composer form{max-width:680px;margin:0 auto;border:1px solid #DEDCD1;border-radius:20px;background:#fff;box-shadow:0 1px 2px rgba(20,20,19,.04),0 4px 14px rgba(20,20,19,.04);padding:12px 12px 10px 16px}
.composer textarea{width:100%;border:0;font:inherit;font-size:15.5px;outline:none;resize:none;background:transparent;color:var(--chat-ink);min-height:26px;max-height:140px}
.composer textarea::placeholder{color:#8C8B85}
.crow{display:flex;align-items:center;gap:6px;margin-top:6px}
.crow .ib{width:32px;height:32px;border-radius:8px;border:1px solid var(--chat-line);background:#fff;display:grid;place-items:center;color:#5E5D59}
.crow .conn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--green-ink);border:1px solid #CFDAD4;background:#F4F8F6;border-radius:8px;padding:5px 9px}
.crow .sp{flex:1}
.crow .model{font-size:13px;color:#5E5D59;padding:6px 8px;border-radius:8px}
.crow .send{width:32px;height:32px;border-radius:9px;border:0;background:var(--accent);display:grid;place-items:center}
.crow .send:hover{background:var(--accent-ink)}
.composer .fine{font-size:11.5px;color:var(--chat-muted);text-align:center;margin-top:8px}
.err{color:var(--red);font-size:13.5px;font-family:var(--chat-font)}

/* ---------- Claude question card ---------- */
.askcard{border:1px solid var(--chat-line);border-radius:14px;background:#fff;overflow:hidden;box-shadow:0 1px 2px rgba(20,20,19,.03)}
.askq{padding:14px 16px 12px;font-size:15px;font-weight:500;line-height:1.45;color:var(--chat-ink)}
.askopt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border:0;border-top:1px solid var(--chat-line);padding:11px 16px;font-size:14.5px;color:var(--chat-ink);position:relative}
.askopt:hover,.askopt.hov{background:#FAF9F5}
.askopt .n{width:22px;height:22px;border-radius:6px;border:1px solid #DEDCD1;display:grid;place-items:center;font-size:12px;color:var(--chat-muted);flex:none;font-variant-numeric:tabular-nums}
.askopt[aria-pressed="true"]{background:#F0EEE6}
.askopt[aria-pressed="true"] .n{background:#141413;color:#fff;border-color:#141413}
.askopt.demo::after{content:"";position:absolute;right:14px;top:50%;margin-top:-3.5px;width:7px;height:7px;border-radius:50%;background:#7FB89C}
.askother{display:flex;gap:8px;border-top:1px solid var(--chat-line);padding:7px 8px 7px 16px;align-items:center}
.askother input{flex:1;border:0;outline:none;font:inherit;font-size:14.5px;background:transparent;color:var(--chat-ink)}
.askother input::placeholder{color:#8C8B85}
.askother button{border:1px solid var(--chat-line);background:#fff;border-radius:8px;padding:5px 10px;font-size:13px;color:var(--chat-ink)}
.askfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 12px 9px 16px;border-top:1px solid var(--chat-line);font-size:12.5px;color:var(--chat-muted)}
.askfoot .go{margin:0}
.w.ask.done .askcard{background:#FDFDFB}
.viewswitch .sep{width:1px;background:#E8E6DC;margin:4px 3px}
.viewswitch .play{color:var(--accent-ink);font-weight:500}
.viewswitch .play[aria-pressed="true"]{background:var(--accent);color:#fff}

/* ---------- visit type, scheduling, video call ---------- */
.vopt{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border:0;border-top:1px solid var(--chat-line);padding:13px 16px;color:inherit}
.cardhead + .vopt{border-top:0}
.vopt:hover,.vopt.hov{background:#FAF9F5}
.vopt[aria-pressed="true"]{background:#F0EEE6}
.vopt .vi{width:36px;height:36px;border-radius:10px;background:#E3ECE7;display:grid;place-items:center;color:var(--green-ink)}
.vopt b{font-size:15px;font-weight:600;display:block}
.vopt small{display:block;font-size:13px;color:var(--chat-muted);margin-top:1px}
.vopt .price{font-size:17px;font-weight:600}
.slots{padding:4px 16px 14px;border-top:1px solid var(--chat-line);background:#FDFDFB}
.slots .day{font-size:12.5px;color:var(--chat-muted);margin:10px 0 6px}
.slots .chips{gap:6px}
.slots .chip{border-radius:8px;padding:7px 11px;font-size:13.5px}
.slots .confirm{margin-top:12px;background:var(--green);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:500}
.slots .confirm:disabled{opacity:.35;cursor:not-allowed}
.appt{display:flex;gap:14px;align-items:center;padding:14px 16px}
.appt .cal{width:46px;border-radius:9px;overflow:hidden;border:1px solid var(--chat-line);text-align:center;flex:none;font-family:var(--chat-font)}
.appt .cal span{display:block;background:var(--green);color:#fff;font-size:10.5px;padding:2px 0;font-weight:600}
.appt .cal b{display:block;font-size:17px;padding:3px 0 4px}
.appt .t{font-size:15px;font-weight:600}
.appt .s{font-size:13px;color:var(--chat-muted)}
.appt .join{margin-left:auto;background:var(--green);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:500;white-space:nowrap}
.appt .join:disabled{background:#E8E6DC;color:#8C8B85;cursor:default}
.drmsg .zoom{display:flex;gap:12px;align-items:center;margin-top:12px;background:#fff;border:1px solid #DCE9E1;border-radius:10px;padding:10px 12px}
.drmsg .zoom .zi{width:32px;height:32px;border-radius:8px;background:#2D6CDF;display:grid;place-items:center;flex:none}
.drmsg .zoom b{display:block;font-size:14px}
.drmsg .zoom span{display:block;font-size:13.5px;color:#2D6CDF}
.drmsg .zoom small{display:block;font-size:12px;color:var(--chat-muted)}
.appt .s.ok{color:var(--green);margin-top:2px}
.call{position:fixed;inset:0;z-index:40;background:#111312;display:flex;flex-direction:column;color:#fff;font-family:var(--chat-font);animation:winin .25s ease-out}
.call .stage{flex:1;display:grid;place-items:center;position:relative}
.call .big{width:180px;height:180px;border-radius:50%;background:#2B3A33;display:grid;place-items:center;font-size:56px;font-weight:600;color:#CFE3D8}
.call .who{position:absolute;left:24px;bottom:22px;font-size:15px}
.call .who small{display:block;color:#9CA8A2;font-size:13px}
.call .self{position:absolute;right:24px;bottom:22px;width:200px;height:130px;border-radius:12px;background:#2A2C2B;display:grid;place-items:center;font-size:28px;color:#C9CCCA;border:1px solid #3A3D3B}
.call .top{display:flex;justify-content:space-between;padding:16px 24px;font-size:13.5px;color:#C9CCCA}
.call .ctrls{display:flex;justify-content:center;gap:12px;padding:18px 0 26px}
.call .ctrls button{width:48px;height:48px;border-radius:50%;border:0;background:#2A2C2B;color:#fff;display:grid;place-items:center}
.call .ctrls .end{background:#C2412D;width:64px;border-radius:24px}
.speaking{box-shadow:0 0 0 6px rgba(95,211,154,.25);animation:speak 1.6s ease-in-out infinite}
@keyframes speak{50%{box-shadow:0 0 0 12px rgba(95,211,154,.12)}}

/* ---------- WINDOWS ---------- */
.viewswitch{position:fixed;left:64px;bottom:14px;z-index:15;display:inline-flex;background:#fff;border:1px solid #DEDCD1;border-radius:10px;padding:3px;gap:2px;box-shadow:0 2px 10px rgba(20,20,19,.08);font-family:var(--chat-font)}
.viewswitch button{border:0;background:transparent;color:#5E5D59;font-size:12.5px;padding:6px 10px;border-radius:7px;position:relative}
.viewswitch button[aria-pressed="true"]{background:#141413;color:#fff}
.viewswitch button:disabled{opacity:.4;cursor:default}
.viewswitch button.ping::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.offline{margin:22px auto 0;max-width:460px;font-size:13.5px;color:#5E5D59;line-height:1.55;border:1px solid var(--chat-line);background:#fff;border-radius:12px;padding:12px 14px}
.offline b{color:var(--red);font-weight:600}
.ghostbtn{margin-top:8px;background:transparent;border:1px solid #DEDCD1;border-radius:8px;padding:6px 10px;font-size:13px;color:var(--chat-ink)}
.model.off{color:var(--red)}
body.v-patient .split, body.v-clinician .split{grid-template-columns:1fr}
body.v-patient .console{display:none}
body.v-clinician .chat{display:none}
body.v-clinician .console{animation:winin .28s ease-out}
body.v-patient .chat{animation:winin .28s ease-out;border-right:0}
@keyframes winin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
body.v-clinician .c-body{padding:16px 24px 28px;max-width:1480px;margin:0 auto;width:100%}
.seg button.ping{position:relative}
.seg button.ping::after{content:"";position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:#F2B84B}
.toast{position:fixed;right:22px;top:16px;z-index:20;background:#13191C;color:#fff;border-radius:12px;padding:14px 16px;display:flex;gap:14px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);font-family:var(--c-font);font-size:14px;max-width:420px;animation:winin .25s ease-out}
.toast small{display:block;color:#AEB9BF;font-size:12.5px;margin-top:2px}
.toast button{background:#E6EFEA;color:#0F2E24;border:0;border-radius:8px;padding:8px 12px;font-weight:600;white-space:nowrap}
.toast .x{background:transparent;color:#AEB9BF;padding:4px 6px}

/* ---------- CONSOLE LAYOUT: queue | chart | decision ---------- */
.cx{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;align-items:start}
.cx-queue{position:sticky;top:0;display:flex;flex-direction:column;gap:6px}
.cx-queue .qh{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--c-muted);text-transform:uppercase;letter-spacing:.04em;padding:2px 4px 4px}
.cx-queue .qh span{text-transform:none;letter-spacing:0;font-weight:500}
.qi{display:block;text-align:left;width:100%;background:var(--c-panel);border:1px solid var(--c-line);border-radius:8px;padding:9px 11px;font:inherit;font-size:12.5px;color:var(--c-muted)}
.qi.active{border-color:var(--green);box-shadow:inset 3px 0 0 var(--green);background:#fff}
.qi .top{display:flex;justify-content:space-between}
.qi .id{font-family:var(--mono);font-size:11.5px}
.qi .wt{font-size:11.5px;color:var(--amber);font-weight:600}
.qi b{display:block;color:var(--c-ink);font-weight:600;font-size:13.5px;margin:2px 0}
.qi .meta{display:flex;justify-content:space-between;gap:6px}
.qi .tag{font-size:11px;border:1px solid var(--c-line);border-radius:5px;padding:0 5px;color:var(--c-ink)}
.cx-main{min-width:0}
.pbanner{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;background:var(--c-panel);border:1px solid var(--c-line);border-radius:10px;padding:12px 16px;margin-bottom:12px;position:sticky;top:0;z-index:2}
.pbanner .who{display:flex;gap:12px;align-items:center}
.pbanner h2{margin:0;font-size:19px;font-weight:600}
.pbanner .demo{color:var(--c-muted);font-size:12.5px;margin-top:2px;font-family:var(--mono)}
.pbanner .chips{display:flex;flex-wrap:wrap;gap:6px}
.pbanner .clock{text-align:right;font-size:12px;color:var(--c-muted);display:grid;gap:4px;justify-items:end}
.chip{font-size:12px;font-weight:500;padding:3px 9px;border-radius:6px;background:var(--c-soft);border:1px solid var(--c-line);color:var(--c-muted);white-space:nowrap}
.chip.g{background:var(--green-soft);color:var(--green-ink);border-color:#BFD9CB}
.chip.r{background:var(--red-soft);color:var(--red);border-color:#EDC4BC;font-weight:600}
.chip.b{background:#EAF0F7;color:#24466B;border-color:#C9D7E8}
.cx-cols{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:12px;align-items:start}
.cx-chart{display:grid;gap:12px;min-width:0}
.card{background:var(--c-panel);border:1px solid var(--c-line);border-radius:10px;padding:13px 16px}
.card h3{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--c-ink);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.card h3 .src{font-weight:400;color:var(--c-muted);font-size:12px}
.card h3 .src.ai{color:var(--accent-ink)}
.hpi{margin:0 0 8px;font-size:15px;line-height:1.5}
.verdict{display:inline-block;font-size:13.5px;font-weight:600;padding:5px 10px;border-radius:7px;background:var(--c-soft);color:var(--c-muted);margin-bottom:10px}
.verdict.g{background:var(--green-soft);color:var(--green-ink)}.verdict.a{background:var(--amber-soft);color:var(--amber)}.verdict.r{background:var(--red-soft);color:var(--red)}
.card .quote{font-size:13.5px}
.card .quote .k,.rxcard .k{color:var(--c-muted);font-size:12px}
.crits{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;font-size:13.5px}
.crit{display:flex;gap:8px;align-items:center;padding:3px 4px;border-radius:5px}
.crit .mark{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;background:var(--c-soft);color:#9AA6AC}
.crit.ok .mark{background:var(--green-soft);color:var(--green)}
.crit.bad .mark{background:var(--red-soft);color:var(--red)}.crit.bad{color:var(--red);font-weight:600}
.crit.warn .mark{background:var(--amber-soft);color:var(--amber)}.crit.warn{color:var(--amber);font-weight:600}
.crit.wait{color:#9AA6AC}
details.fold summary{cursor:pointer;list-style:none}
details.fold summary h3{margin:0}
details.fold[open] summary h3{margin-bottom:8px}
.decide{position:sticky;top:76px;display:grid;gap:12px;max-height:calc(100vh - 150px);overflow-y:auto;overscroll-behavior:contain;padding-bottom:4px}
.rxcard .dx{font-size:13px;margin-bottom:8px}
.rxline{border:1px solid var(--c-line);border-radius:8px;padding:9px 11px;background:#FBFCFC;font-size:13.5px;line-height:1.5}
.rxline b{display:block;font-size:14px}
.rxcard .checks{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;margin:8px 0 2px}
.rxcard .checks .ok{color:var(--green)}.rxcard .checks .bad{color:var(--red);font-weight:600}.rxcard .checks .wait{color:#9AA6AC}
.decide .actions{padding:0}
.decide .actions .approve{flex:1 1 100%;padding:11px 14px;font-size:15px}
.decide .signed{border-radius:10px;border:1px solid #BFD9CB}
.card.stop{border-color:#EDC4BC;background:#FFF8F6}
.card.stop p{margin:0 0 6px;font-size:14px;line-height:1.5}
.card.stop p.hard{color:var(--red);font-weight:600}
.card.stop:has(.hard){border-color:var(--red)}
.cx .log{margin-top:0}
@media (max-width:1180px){.cx{grid-template-columns:1fr}.cx-queue{position:static;flex-direction:row;overflow-x:auto}.qi{min-width:180px}.cx-queue .qh{display:none}}
@media (max-width:1020px){.cx-cols{grid-template-columns:1fr}.decide{position:static}.crits{grid-template-columns:1fr}.pbanner{grid-template-columns:1fr;position:static}.pbanner .clock{justify-items:start;text-align:left}}

/* ---------- CONSOLE ---------- */

.console{font-family:var(--c-font);color:var(--c-ink);display:flex;flex-direction:column;min-height:0;height:100%;overflow:hidden}
.c-head{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--c-panel);border-bottom:1px solid var(--c-line);gap:12px;flex-wrap:wrap}
.c-head .t{font-weight:600;font-size:15px}
.c-head .doc{color:var(--c-muted);font-size:13px}
.view{display:inline-flex;border:1px solid var(--c-line);border-radius:7px;overflow:hidden;font-size:13px}
.view button{border:0;background:#fff;color:var(--c-muted);padding:6px 11px}
.view button[aria-pressed="true"]{background:var(--c-ink);color:#fff}
.c-body{flex:1;overflow-y:auto;padding:16px 20px 24px}
.queue{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto}
.q{flex:none;background:var(--c-panel);border:1px solid var(--c-line);border-radius:8px;padding:8px 12px;font-size:12.5px;color:var(--c-muted);min-width:170px}
.q b{display:block;color:var(--c-ink);font-weight:500;font-size:13px}
.q.active{border-color:var(--green);box-shadow:inset 3px 0 0 var(--green)}
.q .id{font-family:var(--mono);font-size:11.5px}
.case{background:var(--c-panel);border:1px solid var(--c-line);border-radius:10px}
.case-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:16px 18px;border-bottom:1px solid var(--c-line)}
.case-top h2{margin:0;font-size:21px;font-weight:600}
.case-top .demo{color:var(--c-muted);font-size:13.5px;margin-top:3px}
.case-top .right{text-align:right;font-size:12.5px;color:var(--c-muted);line-height:1.6}
.case-top .id{font-family:var(--mono);font-size:12px}
.pill{display:inline-block;font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;background:var(--c-soft);color:var(--c-muted);border:1px solid var(--c-line)}
.pill.g{background:var(--green-soft);color:var(--green-ink);border-color:#BFD9CB}
.pill.r{background:var(--red-soft);color:var(--red);border-color:#EDC4BC}
.pill.a{background:var(--amber-soft);color:var(--amber);border-color:#E7D2A6}
.grid{display:grid;grid-template-columns:1fr 1fr}
@media (max-width:1300px){.grid{grid-template-columns:1fr}}
.sec{padding:14px 18px;border-bottom:1px solid var(--c-line)}
.grid .sec:nth-child(odd){border-right:1px solid var(--c-line)}
@media (max-width:1300px){.grid .sec:nth-child(odd){border-right:0}}
.sec.full{grid-column:1 / -1;border-right:0!important}
.sec h3{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--c-muted)}
.row{display:grid;grid-template-columns:132px 1fr;gap:10px;padding:5px 6px;margin:0 -6px;border-radius:5px;font-size:14px;line-height:1.4}
.row .k{color:var(--c-muted);font-size:13px}
.row .v.wait{color:#9AA6AC}
.row .v .ok{color:var(--green);font-size:12.5px;margin-left:6px;white-space:nowrap}
.row .v .bad{color:var(--red);font-size:12.5px;margin-left:6px}
.masked{font-family:var(--mono);font-size:12.5px;background:#EEF1F3;border-radius:4px;padding:1px 6px;color:#3B4A52}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:#CFEBDC}100%{background:transparent}}
table.scr{width:100%;border-collapse:collapse;font-size:13.5px}
table.scr td{padding:6px 6px;border-top:1px solid #EDF0F2;vertical-align:top}
table.scr tr:first-child td{border-top:0}
table.scr td:first-child{color:var(--c-muted);width:34%}
table.scr td:last-child{text-align:right;width:84px}
.neg{font-size:13px;color:var(--c-muted);margin-top:8px;line-height:1.45}
.dispo{font-size:16px;font-weight:600;margin:2px 0 4px}
.dispo.g{color:var(--green)}.dispo.r{color:var(--red)}.dispo.a{color:var(--amber)}
.quote{font-size:14px;line-height:1.5;border-left:3px solid var(--c-line);padding-left:10px;color:#2A3439}
.draftwrap textarea{width:100%;min-height:128px;border:1px solid var(--c-line);border-radius:8px;padding:10px 12px;font:inherit;font-size:14px;line-height:1.5;resize:vertical;background:var(--c-soft);color:var(--c-ink)}
.draftwrap textarea:not([readonly]){background:#fff;border-color:var(--green)}
.plan{font-size:13.5px;line-height:1.55;margin-top:10px}
.plan b{font-weight:600}
.sim{font-size:12px;color:var(--amber)}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding:14px 18px}
.actions button{border:1px solid var(--c-line);background:#fff;color:var(--c-ink);border-radius:8px;padding:9px 14px;font-size:14px;font-weight:500}
.actions .approve{background:var(--green);border-color:var(--green);color:#fff}
.actions button:disabled{opacity:.4;cursor:not-allowed}
.signed{padding:12px 18px;font-size:14px;color:var(--green-ink);background:var(--green-soft);border-top:1px solid #BFD9CB}
.log{margin-top:14px;background:var(--c-panel);border:1px solid var(--c-line);border-radius:10px;padding:12px 18px}
.log h3{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--c-muted)}
.log ol{list-style:none;margin:0;padding:0;font-size:13px}
.log li{display:grid;grid-template-columns:70px 1fr;gap:10px;padding:4px 0;border-top:1px solid #F0F2F4}
.log li:first-child{border-top:0}
.log time{font-family:var(--mono);font-size:12px;color:var(--c-muted)}
.c-empty{background:var(--c-panel);border:1px dashed var(--c-line);border-radius:10px;padding:48px 28px;text-align:center;color:var(--c-muted);line-height:1.6}
.c-empty b{display:block;color:var(--c-ink);font-size:17px;font-weight:500;margin-bottom:4px}
.foot{font-size:11.5px;color:var(--c-muted);margin-top:12px}
/* ---------- CONSOLE POLISH: restraint, ledger, provenance, signing ---------- */
.console{font-variant-numeric:tabular-nums}
.card{border-radius:8px;box-shadow:none;padding:12px 14px}
.card h3{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--c-muted);align-items:center}
.card h3 .src{text-transform:none;letter-spacing:0;font-size:11.5px}
.cx-queue .qh{font-size:10.5px;letter-spacing:.08em}
.row{font-size:13.5px;grid-template-columns:120px 1fr auto;align-items:baseline}
.row .k{font-size:12.5px}
.rmeta,table.scr td.rmeta{display:inline-flex;gap:6px;align-items:center;justify-content:flex-end;white-space:nowrap}
.rmeta time{font-family:var(--mono);font-size:11px;color:var(--c-muted);opacity:.75}
table.scr td.rmeta{width:118px}
table.scr td:last-child{text-align:right}
.dim{color:#9AA6AC}
.src-mark{display:inline-grid;place-items:center;min-width:17px;height:15px;padding:0 3px;border-radius:3px;font:600 9.5px/1 var(--mono);letter-spacing:.02em;border:1px solid var(--c-line);color:var(--c-muted);background:var(--c-panel);cursor:help}
.src-mark.ai{color:var(--accent-ink);border-color:#E9C6B7}
.src-mark.rules{color:var(--green);border-color:#BFD9CB}
.src-mark.clinician{color:#24466B;border-color:#C9D7E8}
/* quiet chips: grey unless it is a hazard */
.chip{background:transparent;border-color:var(--c-line);color:var(--c-ink);font-weight:500}
.chip.wait{color:#9AA6AC;border-style:dashed}
.chip.r{background:var(--red-soft);color:var(--red);border-color:#EDC4BC}
.ringrow{display:inline-flex;gap:7px;align-items:center;font-family:var(--mono);font-size:11.5px}
.verdict{font-size:12.5px;padding:3px 9px;border-radius:5px;display:inline-flex;gap:6px;align-items:center}
.verdict::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
/* black-bar redaction in "What Claude saw" */
.masked{background:#111;color:#fff;border-radius:2px;padding:1px 7px;font-size:11px;letter-spacing:.02em;animation:redact .45s cubic-bezier(.2,.7,.2,1) both}
@keyframes redact{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
/* prescription pad */
.rxline{position:relative;overflow:hidden;padding:12px 12px 10px 44px;background:var(--c-panel);border:1px solid var(--c-line);
  background-image:radial-gradient(circle at 6px -2px,var(--c-bg) 4px,transparent 4.5px);background-size:14px 8px;background-repeat:repeat-x;background-position:0 0}
.rxsym{position:absolute;left:12px;top:10px;font:600 24px/1 var(--serif);color:var(--c-ink)}
.rxline .wm{position:absolute;right:-8px;bottom:6px;font:700 11px/1 var(--mono);letter-spacing:.3em;color:var(--red);opacity:.22;transform:rotate(-8deg)}
/* actions: hold to sign, shortcut hints */
.actions button{display:inline-flex;align-items:center;gap:8px;justify-content:center}
.actions kbd{font:500 10.5px/1 var(--mono);padding:2px 5px;border-radius:4px;border:1px solid currentColor;opacity:.55}
.actions .hold{position:relative;overflow:hidden}
.actions .hold .fill{position:absolute;inset:0;background:rgba(255,255,255,.22);transform:scaleX(0);transform-origin:left}
.actions .hold.holding .fill{transform:scaleX(1);transition:transform 1s linear}
.actions .hold .lbl,.actions .hold kbd{position:relative}
.sigstamp{border:2px solid var(--green);border-radius:8px;padding:10px 14px;color:var(--green-ink);background:var(--c-panel);transform:rotate(-1.2deg);animation:stamp .35s cubic-bezier(.2,1.4,.4,1) both}
.sigstamp .t{font:700 11px/1 var(--mono);letter-spacing:.28em;text-transform:uppercase;margin-bottom:6px}
.sigstamp .nm{font-family:var(--serif);font-style:italic;font-size:19px}
.sigstamp .mono{font:11.5px var(--mono);margin-top:2px}
.sigstamp .sub{font-size:12px;margin-top:6px;color:var(--c-muted)}
@keyframes stamp{from{opacity:0;transform:rotate(-1.2deg) scale(1.25)}to{opacity:1;transform:rotate(-1.2deg) scale(1)}}
.diff{margin:0;font-size:13.5px;line-height:1.6}
.diff del{color:var(--red);text-decoration-thickness:1.5px;background:var(--red-soft)}
.diff ins{color:var(--green-ink);text-decoration:none;background:var(--green-soft);border-bottom:1.5px solid var(--green)}
/* audit log as a timeline */
.timeline{position:relative}
.timeline li{grid-template-columns:52px 1fr;border-top:0!important;position:relative;padding:5px 0 5px 0}
.timeline li::before{content:"";position:absolute;left:61px;top:11px;width:7px;height:7px;border-radius:50%;background:var(--c-panel);border:1.5px solid var(--green)}
.timeline li::after{content:"";position:absolute;left:64.5px;top:20px;bottom:-6px;width:1px;background:var(--c-line)}
.timeline li:last-child::after{display:none}
.timeline li span{padding-left:22px}
/* empty inbox */
.c-empty .stats{display:flex;gap:22px;justify-content:center;margin:6px 0 10px;font-size:13px}
.c-empty .stats em{font-style:normal;font-weight:600;color:var(--c-ink);font-family:var(--mono)}
/* night shift */
body.night{--c-bg:#0E1416;--c-panel:#151D20;--c-ink:#E3EAEC;--c-muted:#8B9AA0;--c-line:#26333A;--c-soft:#1B2529;
  --green:#5FBF93;--green-ink:#9FE0C0;--green-soft:#173027;--red:#FF8A7A;--red-soft:#3A1C18;--amber:#F2B84B;--amber-soft:#33280F}
body.night .console,body.night .c-body{background:var(--c-bg)}
body.night .c-head,body.night .qi.active{background:var(--c-panel)}
body.night .view button{background:var(--c-panel);color:var(--c-muted)}
body.night .view button[aria-pressed="true"]{background:var(--c-ink);color:var(--c-bg)}
body.night .rxline{background-color:var(--c-panel)}
body.night .draftwrap textarea{background:var(--c-soft);color:var(--c-ink)}
body.night .actions button{background:var(--c-panel);color:var(--c-ink);border-color:var(--c-line)}
body.night .actions .approve{background:var(--green);color:#0E1416;border-color:var(--green)}
body.night .masked{background:#000;color:#E3EAEC}
body.night .avatar{background:#1E2D29;color:var(--green-ink)}
body.night .card.stop{background:#24161A}
body.night .quote{color:var(--c-ink)}
body.night table.scr td{border-top-color:var(--c-line)}
body.night .rxline .wm{opacity:.35}

/* ---------- CLINICIAN DASHBOARD ---------- */
.dash{display:grid;gap:14px;max-width:1240px;margin:0 auto}
.dhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.dhead h2{margin:0;font-size:22px;font-weight:600;letter-spacing:-.01em}
.dhead .demo{font:12px var(--mono);color:var(--c-muted);margin-top:4px}
.dhead .status{display:inline-flex;gap:8px;align-items:center;font-size:13px;font-weight:600;border:1px solid var(--c-line);border-radius:999px;padding:6px 12px;background:var(--c-panel)}
.dhead .status .dot{width:8px;height:8px;border-radius:50%;background:#9AA6AC}
.dhead .status.on .dot{background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.tile{background:var(--c-panel);border:1px solid var(--c-line);border-radius:8px;padding:12px 14px}
.tile .k{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--c-muted)}
.tile .v{font:600 26px/1.15 var(--c-font);margin:6px 0 2px;letter-spacing:-.01em}
.tile .s{font-size:12px;color:var(--c-muted)}
.tile.act{border-color:var(--green);box-shadow:inset 3px 0 0 var(--green)}
.tile.safe .v{color:var(--c-ink)}
.dgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px;align-items:start}
.dgrid > :nth-child(1){grid-area:1/1}.dgrid > :nth-child(2){grid-area:1/2}.dgrid > :nth-child(3){grid-area:2/1/4/2}.dgrid > :nth-child(4){grid-area:2/2}.dgrid > :nth-child(5){grid-area:3/2}.dgrid > :nth-child(6){grid-area:4/1/5/3}
.chart{margin:4px 0 0}
.chart svg{width:100%;height:auto;display:block}
.chart .g{stroke:var(--c-line);stroke-width:1}
.chart .ax{font:10.5px var(--mono);fill:var(--c-muted)}
.chart .lbl{font:600 11px var(--mono);fill:var(--c-ink)}
.chart .bar path{fill:#2B8A62;opacity:.55;transition:opacity .15s}
.chart .bar.now path{opacity:1}
.chart .bar .hit{fill:transparent}
.chart .bar:hover path,.chart .bar:focus path{opacity:1}
.chart .bar:focus{outline:none}
.card .note{margin:6px 0 0;font-size:12.5px;color:var(--c-muted)}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:6px 0;border-top:1px solid var(--c-line)}
.kv span{color:var(--c-muted)}
.kv b{font-weight:500;text-align:right}
.okc{color:var(--green)}
.lnk{display:inline-block;margin-top:8px;font-size:12.5px;color:var(--green);text-decoration:none;border-bottom:1px solid currentColor}
.tgl{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:8px 0;cursor:pointer;position:relative}
.tgl input{position:absolute;opacity:0;width:36px;height:20px;margin:0;cursor:pointer}
.tgl .sw{width:36px;height:20px;border-radius:999px;background:var(--c-line);position:relative;transition:background .15s}
.tgl .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tgl input:checked + .sw{background:var(--green)}
.tgl input:checked + .sw::after{transform:translateX(16px)}
.tgl input:focus-visible + .sw{outline:2px solid var(--green);outline-offset:2px}
.tgl b{display:block;font-size:13.5px;font-weight:500}
.tgl small{font-size:12px;color:var(--c-muted)}
.mixbar{display:flex;gap:2px;height:14px;margin:8px 0 10px}
.mixbar span{border-radius:3px}
.mixbar .on,.legend i.on{background:#2B8A62}
.mixbar .vid,.legend i.vid{background:#3A6FD0}
.legend{display:grid;gap:4px;font-size:12.5px;margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:7px;vertical-align:-1px}
.ptab{width:100%;border-collapse:collapse;font-size:13px}
.ptab th{text-align:left;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--c-muted);padding:6px 8px;border-bottom:1px solid var(--c-line)}
.ptab td{padding:8px;border-bottom:1px solid var(--c-line)}
.ptab tr:last-child td{border-bottom:0}
.ptab .mono{font-family:var(--mono);font-size:12px}
.ptab tr.live{cursor:pointer;background:var(--c-soft)}
.ptab tr.live td:first-child{box-shadow:inset 3px 0 0 var(--green)}
.st{font-size:12px;border:1px solid var(--c-line);border-radius:5px;padding:2px 7px;white-space:nowrap}
.st.act{border-color:var(--green);color:var(--green);font-weight:600}
.st.ref{color:var(--c-muted);border-style:dashed}
.view.tabs button[aria-pressed="true"]{background:var(--c-ink);color:#fff}
body.night .chart .bar path,body.night .mixbar .on,body.night .legend i.on{fill:#34A574;background:#34A574}
body.night .mixbar .vid,body.night .legend i.vid{background:#7A86F2}
body.night .tgl .sw::after{background:#E3EAEC}
body.night .view.tabs button[aria-pressed="true"]{background:var(--c-ink);color:var(--c-bg)}
@media (max-width:1180px){.tiles{grid-template-columns:repeat(3,1fr)}.dgrid{grid-template-columns:1fr}.dgrid > *{grid-area:auto!important}}

/* ---------- CLINICAL PAPER (from the Superdesign "Clinical paper" direction) ---------- */
body:not(.night) .console{background:var(--c-bg)}
.pbanner h2{font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:-.005em;line-height:1.1}
.hpi{font-family:var(--serif);font-size:17px;line-height:1.6;margin:2px 0 12px}
.dhead h2{font-family:var(--serif);font-size:26px;font-weight:600}
.tile .v{font-family:var(--serif);font-weight:600}
.pbanner .avatar{background:#EAF0F7;color:#24466B;font-family:var(--serif);font-size:15px}
body:not(.night) .rxline{background-color:#FFFDF8}
body:not(.night) .chip{background:var(--c-panel)}
body:not(.night) .tgl .sw{background:#DAD5CA}
body:not(.night) .tgl input:checked + .sw{background:var(--green)}
.chart .bar path{opacity:.5}

<script src="engine.js"></script>
<script>
/* =========================================================
   UI helpers
   ========================================================= */
const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "html") el.innerHTML = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(String(k)));
  return el;
}
// Play demo pace: every pause in the scripted run is multiplied by this (1 = human speed, lower = faster).
const DEMO_PACE = 0.55;
// While the Play demo is paused, every scripted pause waits until it resumes.
let paused = false;
const sleep = ms => new Promise(r => setTimeout(r, mode === "scripted" ? ms * DEMO_PACE : ms))
  .then(async () => { while (paused && mode === "scripted") await new Promise(r => setTimeout(r, 150)); });
function setPaused(p) {
  paused = p; const b = $("#pausebtn");
  b.setAttribute("aria-pressed", p ? "true" : "false"); b.textContent = p ? "Resume" : "Pause";
}
const thread = $("#thread");
const threadWrap = $("#threadwrap");
// Auto-scroll only while the reader is at the bottom of the chat. Scrolling up to read pauses it;
// scrolling back to the bottom turns it back on (like any chat app).
let followChat = true;
const atChatBottom = () => threadWrap.scrollHeight - threadWrap.scrollTop - threadWrap.clientHeight < 80;
// Only your own scrolling (wheel, touch, keys, scrollbar drag) stops the follow; the app's own scrolling never does.
let userScrolling = false;
["wheel", "touchmove", "pointerdown"].forEach(ev => threadWrap.addEventListener(ev, () => { userScrolling = true; }, { passive: true }));
["pointerup", "touchend"].forEach(ev => window.addEventListener(ev, () => { userScrolling = false; followChat = atChatBottom(); }, { passive: true }));
threadWrap.addEventListener("keydown", e => { if (["PageUp", "ArrowUp", "Home"].includes(e.key)) followChat = false; });
threadWrap.addEventListener("scroll", () => { if (atChatBottom()) followChat = true; else if (userScrolling) followChat = false; });
threadWrap.addEventListener("wheel", e => { if (e.deltaY < 0) followChat = false; else setTimeout(() => { if (atChatBottom()) followChat = true; }, 120); }, { passive: true });
function scrollDown(force) { if (force || followChat) threadWrap.scrollTop = threadWrap.scrollHeight; }
function addEl(el) { thread.append(el); scrollDown(); return el; }
function initials(name) { return name.replace(/^Dr\. /, "").split(/[\s-]+/).map(p => p[0]).slice(0, 2).join(""); }

let busy = false;
let mode = "live";
let runToken = 0;

function thinkingEl() { return h("div", { class: "msg ai" }, h("span", { class: "thinking", "aria-label": "Claude is thinking" }, h("span", { class: "pulse" }))); }
// Streams a reply word by word, with the small bit of markdown Claude uses in chat:
// paragraphs, "- " or "1. " lists, and **bold**. Text is added as text nodes, never as HTML.
async function streamInto(el, text, token) {
  el.replaceChildren();
  let n = 0;
  const words = async (target, line) => {
    for (const part of line.split(/(\*\*[^*]+\*\*)/)) {
      const bold = /^\*\*[^*]+\*\*$/.test(part);
      const box = bold ? target.appendChild(h("b")) : target;
      for (const w of (bold ? part.slice(2, -2) : part).split(/(\s+)/)) {
        if (token !== runToken) return false;
        box.append(w);
        if (++n % 2 === 0) { if (n % 8 === 0) scrollDown(); await sleep(mode === "scripted" ? 22 : 12); }
      }
    }
    return true;
  };
  for (const block of text.split(/\n\n+/)) {
    const lines = block.split("\n").filter(l => l.trim());
    const isList = lines.length && lines.every(l => /^\s*([-*•]|\d+[.)])\s+/.test(l));
    if (isList) {
      const list = el.appendChild(h(/^\s*\d/.test(lines[0]) ? "ol" : "ul"));
      for (const l of lines) if (!(await words(list.appendChild(h("li")), l.replace(/^\s*([-*•]|\d+[.)])\s+/, "")))) return;
    } else if (!(await words(el.appendChild(h("p")), lines.join(" ").replace(/^#+\s*/, "")))) return;
  }
  scrollDown();
}
async function aiSay(text, { tool, result, input } = {}) {
  const token = runToken;
  const think = addEl(thinkingEl());
  await sleep(mode === "scripted" ? 500 : 0);
  if (token !== runToken) return;
  if (tool && SHOW_TOOL_CHIPS) { think.before(toolBlock(tool, input, result)); }
  await sleep(mode === "scripted" ? 250 : 0);
  if (token !== runToken) return;
  if (!text) { think.remove(); return; }
  await streamInto(think, text, token);
}
function toolBlock(name, input, result) {
  return h("details", { class: "tool" },
    h("summary", {}, h("span", { class: "ico", html: '<svg width="12" height="12" viewBox="0 0 20 20"><path d="M5 10.5l3.2 3.2L15 6.8" stroke="#fff" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>' }),
      h("b", {}, "Checkpoint"), h("span", { class: "fn" }, name),
      h("span", { class: "chev", html: '<svg width="14" height="14" viewBox="0 0 16 16"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>' })),
    h("div", { class: "io" }, h("h5", {}, "Request"), h("pre", {}, JSON.stringify(input || {}, null, 2)), h("h5", {}, "Response"), h("pre", {}, JSON.stringify(result, null, 2))));
}
// The "Checkpoint <tool>" chips are hidden in the chat; the cards already show Checkpoint at work,
// and the clinician console's audit log records every call. Set to true to show them again.
const SHOW_TOOL_CHIPS = false;
function toolChip(name, input, result) { if (SHOW_TOOL_CHIPS) addEl(toolBlock(name, input, result)); }
function userSay(text) { addEl(h("div", { class: "msg user" }, text)); }
function userSecure(label) {
  addEl(h("div", { class: "msg user secure" },
    h("svg", { width: 14, height: 14, viewBox: "0 0 16 16", html: '<rect x="3" y="7" width="10" height="7" rx="1.5" fill="none" stroke="#1C5741" stroke-width="1.5"/><path d="M5.5 7V5a2.5 2.5 0 015 0v2" fill="none" stroke="#1C5741" stroke-width="1.5"/>' }),
    h("div", {}, label + " sent to Checkpoint", h("small", {}, "Shared with the clinician only, not with Claude"))));
}
function sysNote(text) { addEl(h("div", { class: "msg sys" }, text)); }
function retire() { thread.querySelectorAll(".w:not(.done)").forEach(w => w.classList.add("done")); }

/* =========================================================
   WIDGETS (rendered from Checkpoint tool results)
   ========================================================= */
function cardHead(t) { return h("div", { class: "cardhead" }, h("span", { class: "ico", html: '<svg width="10" height="10" viewBox="0 0 20 20"><path d="M5 10.5l3.2 3.2L15 6.8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>' }), t); }
function widgetFor(step) {
  if (!step) return null;
  if (step.type === "question") return questionWidget(step);
  if (step.type === "result") return step.disposition === "in_person" ? inPersonWidget() : connectWidget();
  if (step.type === "clinicians") return clinicianWidget(step);
  if (step.type === "field") return fieldWidget(DATA.intake.find(f => f.id === step.field_id));
  if (step.type === "consent") return consentWidget();
  if (step.type === "visit") return visitWidget(step);
  return null;
}
function demoAnswer(qid) { return (S.sc.answers || {})[qid] || []; }
/* Claude's own question card (the ask_user tool). Also used for Checkpoint's screener questions. */
function askCard(input, { demo = [], hint = null, onAnswer }) {
  const multi = !!input.multi_select;
  const picked = new Set();
  const w = h("div", { class: "w ask", "data-ask": "1" });
  const go = h("button", { class: "go", disabled: true, onclick: () => finish([...picked]) }, "Submit");
  function finish(vals) {
    if (busy || !vals.length || w.classList.contains("done")) return;
    w.querySelectorAll(".askopt").forEach(o => o.setAttribute("aria-pressed", vals.includes(o.dataset.label) ? "true" : "false"));
    w.classList.add("done");
    onAnswer(vals);
  }
  const opts = input.options.map((label, i) => h("button", {
    class: "askopt" + (demo.includes(label) ? " demo" : ""), "data-label": label, "aria-pressed": "false",
    onclick: e => {
      if (!multi) return finish([label]);
      const b = e.currentTarget, none = /^none of these$/i.test(label);
      if (none) { picked.clear(); w.querySelectorAll(".askopt").forEach(o => o.setAttribute("aria-pressed", "false")); }
      else { [...picked].filter(v => /^none of these$/i.test(v)).forEach(v => { picked.delete(v); w.querySelector(`[data-label="${CSS.escape(v)}"]`).setAttribute("aria-pressed", "false"); }); }
      if (picked.has(label)) picked.delete(label); else picked.add(label);
      b.setAttribute("aria-pressed", picked.has(label) ? "true" : "false");
      go.disabled = picked.size === 0;
    } }, h("span", { class: "n" }, String(i + 1)), h("span", {}, label)));
  const other = h("input", { placeholder: "Something else", "aria-label": "Type a different answer",
    onkeydown: e => { if (e.key === "Enter" && other.value.trim()) finish([other.value.trim()]); } });
  w.append(h("div", { class: "askcard" },
    h("div", { class: "askq" }, input.question),
    opts,
    h("div", { class: "askother" }, other, h("button", { onclick: () => other.value.trim() && finish([other.value.trim()]) }, "Send")),
    multi || hint ? h("div", { class: "askfoot" }, h("span", {}, hint || "Pick all that apply"), multi ? go : null) : null));
  return w;
}
function questionWidget(step) {
  return askCard({ question: step.text, options: step.options, multi_select: step.multi }, {
    demo: demoAnswer(step.question_id),
    hint: `Safety question ${step.number} of ${step.of}, checked by Checkpoint's fixed rules`,
    onAnswer: vals => Actions.answer(vals)
  });
}
function connectWidget() {
  const options = S.disposition === "video" ? ["Yes, video visit", "Not now"] : ["Text visit", "Video visit", "Not now"];
  return askCard({ question: S.disposition === "video" ? "Want me to set up a video visit with a licensed clinician?" : "Would you like a text visit with a clinician, or a video visit?", options }, {
    demo: [options[0]], onAnswer: vals => Actions.connect(!/not now/i.test(vals[0]), /video/i.test(vals[0]))
  });
}
function inPersonWidget() {
  return h("div", { class: "w info" }, h("div", { class: "alert" },
    h("h4", {}, "Get seen in person tonight"),
    h("div", { style: "font-size:14px;line-height:1.5" }, "If you feel very unwell, faint or confused, call 911."),
    h("ul", {}, DATA.inPerson.map(p => h("li", {}, h("b", {}, p.name), h("span", {}, p.detail))))));
}
function clinicianWidget(step) {
  const w = h("div", { class: "w" });
  const card = h("div", { class: "card" }, cardHead("Checkpoint, clinicians licensed in Florida"), step.clinicians.map(c => {
    const full = DATA.clinicians.find(x => x.id === c.id);
    const inner = [
      h("div", { class: "avatar" }, initials(full.name)),
      h("div", {}, h("div", { class: "nm" }, c.name),
        h("div", { class: "meta" }, c.specialty + ". Speaks " + c.languages.join(", ")),
        h("div", { class: "meta" }, c.online ? `Online now, usually replies in ${c.typical_reply_min} min. ${full.rating} from ${full.visits.toLocaleString()} visits` : "Offline, next available " + c.next_available)),
      h("div", { class: "price" }, "$" + c.price_usd, h("small", {}, c.visit + " visit"))
    ];
    if (!c.online) return h("div", { class: "clin off" }, inner);
    return h("button", { class: "clin" + (S.sc.clinician === c.id ? " demo-pick" : ""), "data-id": c.id,
      onclick: e => { e.currentTarget.classList.add("picked"); w.classList.add("done"); Actions.choose(c.id); } }, inner);
  }), h("div", { class: "cardfoot" }, "Licensed in Florida. Cheapest first. Price is the full visit fee, set before you start."));
  w.append(card);
  return w;
}
function fieldWidget(f) {
  const w = h("div", { class: "w", "data-field": f.id });
  const demo = (S.sc.intake || {})[f.id];
  const send = val => {
    if (busy || !String(val).trim()) return;
    if (f.id === "dob" && age(String(val).trim()) == null) { toast("Check the date", "Use MM/DD/YYYY, for example 05/02/1992.", "OK", hideToast); return; }
    w.classList.add("done"); Actions.field(f.id, String(val).trim());
  };
  let control;
  if (f.type === "single") {
    control = h("div", { class: "chips" }, f.options.map(o => h("button", { class: "chip" + (o === demo ? " demo" : ""), "data-label": o, onclick: () => send(o) }, o)));
  } else {
    // Masked like a password: the patient sees dots while typing, nothing lands in the chat.
    const inp = h("input", { type: "password", placeholder: f.placeholder || f.label, "aria-label": f.label + " (hidden while typing)",
      autocomplete: "off", "data-lpignore": "true", "data-1p-ignore": "true", spellcheck: "false",
      onkeydown: e => { if (e.key === "Enter") send(inp.value); } });
    const eye = h("button", { class: "eye", type: "button", "aria-label": "Show what you typed", "aria-pressed": "false", onclick: () => {
      const show = inp.type === "password"; inp.type = show ? "text" : "password";
      eye.setAttribute("aria-pressed", show ? "true" : "false"); eye.textContent = show ? "Hide" : "Show"; inp.focus();
    } }, "Show");
    control = h("div", { class: "secure" }, h("div", { class: "field" }, h("span", { class: "lock", html: '<svg width="14" height="14" viewBox="0 0 16 16"><rect x="3" y="7" width="10" height="7" rx="1.5" fill="none" stroke="#1C5741" stroke-width="1.5"/><path d="M5.5 7V5a2.5 2.5 0 015 0v2" fill="none" stroke="#1C5741" stroke-width="1.5"/></svg>' }), inp, eye),

function liveAskCard(input) {
  let opts = Array.isArray(input.options) ? input.options.map(String).slice(0, 6) : [];

  if (S.phase === "screening") {
    const q = Engine.qPayload();
    opts = q.options; multi = q.multi; demo = demoAnswer(q.question_id);
  } else if (S.phase === "result" && S.disposition !== "in_person") {
    // The connect question: Checkpoint owns the options, so video is always offered.
    opts = S.disposition === "video" ? ["Yes, video visit", "Not now"] : ["Text visit", "Video visit", "Not now"]; multi = false;
    demo = [opts[0]];
  } else if (opts.some(o => /^yes/i.test(o))) demo = opts.filter(o => /^yes/i.test(o)).slice(0, 1);
  if (opts.length < 2) opts = ["Yes", "No"];

    demo, hint: S.phase === "screening" ? "Safety question, checked by Checkpoint's fixed rules" : null,
    onAnswer: vals => Actions.ask(vals.join(", "))

/* Claude drafts the clinician's reply from the masked case (server: prompts/clinician-draft.md) */
async function requestDraft() {
  S.draftStatus = "template";
  if (mode !== "live" || S.disposition !== "async") return;
  S.draftStatus = "drafting"; renderConsole();
  const c = Engine.clinician(), p = planLines(), token = runToken;
  const payload = {
    protocol: DATA.protocol.id + ", " + DATA.protocol.name,
    disposition: S.disposition,
    screener: Object.fromEntries(Object.entries(S.answers).map(([k, v]) => [DATA.questions.find(q => q.id === k).short, v.vals.join(", ")])),
    clinician: c.name + ", " + c.cred,
    plan: { assessment: p.dx, patient_rx: p.patientRx, required_drug: p.drug },
    followup_72h: !!(S.consents && S.consents.followup)
  };
  try {
    const r = await fetch("/api/draft", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ case: payload }) });
    const j = await r.json();
    if (!r.ok || !j.draft) throw new Error((j.error && j.error.message) || "no draft");
    if (token !== runToken || S.phase !== "submitted") return;
    const ta = $("#draft");
    if (ta && !ta.readOnly) return; // clinician is already editing; keep their text
    S.draft = unmask(j.draft); S.draftStatus = "claude";
    log("Claude drafted the reply from the masked case");
  } catch (e) { S.draftStatus = "template"; log("Draft fell back to the protocol template (" + e.message + ")"); }
  renderConsole();

/* =========================================================
   LIVE MODE: Claude calls Checkpoint tools over a local proxy
   ========================================================= */
const Live = {
  messages: [],
  // The system prompt and tool definitions live on the server (prompts/). The browser only sends the conversation.
  run(name, input) {
    if (name === "checkpoint_screen_next") return Engine.screenNext(input && input.answer);
    if (name === "checkpoint_list_clinicians") return Engine.listClinicians(input && input.visit);
    if (name === "checkpoint_select_clinician") return Engine.selectClinician(input.clinician_id);
    if (name === "checkpoint_intake_next") return Engine.intakeNext();
    return { type: "error", message: "Unknown tool" };
  },
  pending: null, // an ask_user card waiting for the patient's answer
  async send(text) {
    busy = true;
    // A patient who asks for video gets video, whatever Claude passes to the tools.
    if (/\bvideo\b/i.test(text) && ["result", "clinicians", "intake"].includes(S.phase) && !S.visitType && !S.wantsVideo) {
      S.wantsVideo = true; log("Patient asked for a video visit");
    }
    const token = runToken;
    thread.querySelectorAll(".w.ask:not(.done)").forEach(w => w.classList.add("done"));
    if (this.pending) {
      this.messages.push({ role: "user", content: [...this.pending.results, { type: "tool_result", tool_use_id: this.pending.askId, content: "Patient answered: " + text }] });
      this.pending = null;
    } else this.messages.push({ role: "user", content: text });
    let widget = null, ask = null;
    try {
      for (let i = 0; i < 8; i++) {
        const typing = addEl(thinkingEl());
        const res = await fetch("/api/chat", { method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({ messages: this.messages }) });
        typing.remove();
        if (token !== runToken) return;
        const data = await res.json();
        if (!res.ok) throw new Error((data.error && (data.error.message || data.error)) || ("HTTP " + res.status));
        this.messages.push({ role: "assistant", content: data.content });
        const results = [];
        let askBlock = null;
        for (const b of data.content) {
          if (b.type === "text" && b.text.trim()) { const el = addEl(h("div", { class: "msg ai" })); await streamInto(el, b.text.trim(), token); }
          if (b.type === "tool_use" && b.name === "ask_user") { askBlock = b; continue; }
          if (b.type === "tool_use") {
            const out = this.run(b.name, b.input);
            toolChip(b.name.replace("checkpoint_", ""), b.input, out);
            const wd = widgetFor(out); if (wd) widget = { el: wd, kind: out.type === "question" || (out.type === "result" && out.disposition !== "in_person") ? "ask-like" : "connector" };
            results.push({ type: "tool_result", tool_use_id: b.id, content: JSON.stringify(out) });
            renderConsole();
          }
        }
        if (askBlock) { this.pending = { askId: askBlock.id, results }; ask = askBlock.input; break; }
        if (data.stop_reason !== "tool_use" || !results.length) break;
        this.messages.push({ role: "user", content: results });
      }
      // Checkpoint's own cards (clinicians, secure fields, consent, in-person) always show.
      // Its screener buttons show only if Claude didn't ask with its own question card.
      if (widget && !(ask && widget.kind === "ask-like")) addEl(widget.el);
      if (ask) addEl(liveAskCard(ask));
    } catch (e) {
      addEl(h("div", { class: "msg err" }, "Claude API error: " + e.message + ". Check the terminal running node server.js."));
    } finally { busy = false; renderConsole(); }
  }
};

        // Intake values appear at once (like autofill) instead of being typed letter by letter, to keep the demo short.
        if (inp) { inp.value = v; inp.dispatchEvent(new Event("input")); await sleep(500); await press(w.querySelector(".send")); }
        else await press(w.querySelector(`.chip[data-label="${CSS.escape(v)}"]`));
      } else if (w.querySelector(".consent")) {
        await sleep(1500);
        for (const k of ["tele", "ai", "share", "followup"]) { await press(w.querySelector(`[data-k="${k}"]`)); await sleep(500 + Math.random() * 400); }
        await sleep(900); await press(w.querySelector(".pay .go"));
      } else await sleep(600);
    }
    if (!alive() || S.phase !== "submitted") return;
    // The clinician's side
    await waitIdle(); await sleep(3500); if (!alive()) return;
    // From here the presenter chooses which window to watch; the demo never switches windows for them.
    await sleep(4500); if (!alive()) return;
    if (S.visitType === "video") {
      await press($("#actions .approve")); await sleep(1500); if (!alive()) return;   // clinician starts the video visit
      // The patient joins only when the presenter clicks "Join on Zoom", and the call lasts until they end it.
      while (alive() && !document.querySelector(".call")) await sleep(300);
      while (alive() && document.querySelector(".call")) await sleep(300);
      if (!alive()) return;
      await sleep(2500); if (!alive()) return;
    }
    await press($("#actions .approve")); await sleep(2500); if (!alive()) return;   // Approve and send
  } finally {
    if (token === runToken) { playing = false; $("#play").setAttribute("aria-pressed", "false"); $("#play").textContent = "Play demo"; setPaused(false); $("#pausebtn").disabled = true; }
  }
}

/* =========================================================
   WIRING
   ========================================================= */
const params = new URLSearchParams(location.search);
mode = params.get("mode") === "scripted" ? "scripted" : "live";
let liveAvailable = null, apiModel = null;
function prettyModel(m) { const x = m.replace(/^claude-/, "").split("-"); return x[0][0].toUpperCase() + x[0].slice(1) + (x.length > 1 ? " " + x.slice(1).join(".") : ""); }
function modelLabel() {
  const el = $(".crow .model");
  el.classList.toggle("off", mode === "live" && liveAvailable === false);
  el.textContent = mode === "scripted" ? "" : liveAvailable ? prettyModel(apiModel) : liveAvailable === false ? "API not connected" : "Connecting…";
}
function reset(scenarioId, scripted = false) {
  runToken++; busy = false; playing = false;
  mode = scripted ? "scripted" : "live";
  document.querySelectorAll(".call").forEach(c => c.remove()); apptEl = null;
  $("#play").setAttribute("aria-pressed", "false"); $("#play").textContent = "Play demo";
  setPaused(false); $("#pausebtn").disabled = true;
  S = freshState(DATA.scenarios[scenarioId] ? scenarioId : DATA.scenarios[params.get("scenario")] ? params.get("scenario") : "maria");
  Live.messages = []; Live.pending = null; followChat = true;
  seen = new Set();
  const empty = h("div", { class: "empty" }, h("strong", {}, "Good evening, Maria"), h("span", {}, "How can I help you tonight?"));
  if (!scripted && liveAvailable === false) empty.append(h("div", { class: "offline" },
    h("b", {}, "Claude API not connected. "), "Put your key in .env as ANTHROPIC_API_KEY and restart node server.js. Play demo still works, it's scripted."));
  thread.replaceChildren(empty);
  $("#ctitle").textContent = "New chat";
  hideToast(); ["vPatient", "vClin"].forEach(id => $("#" + id).classList.remove("ping"));
  if (win === "clinician") setWin("patient");
  modelLabel();
  renderConsole();
}
$("#input").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#composer").requestSubmit(); } });
$("#input").addEventListener("input", e => { e.target.style.height = "auto"; e.target.style.height = Math.min(e.target.scrollHeight, 140) + "px"; });
$("#newchat").onclick = () => reset();
$("#composer").addEventListener("submit", e => {
  if (!playing) followChat = true; // you sent a message yourself: follow the reply
  e.preventDefault(); const t = $("#input").value.trim(); if (!t) return;
  if (mode === "live" && !liveAvailable) { modelLabel(); return; }
  $("#input").value = ""; $("#input").style.height = "auto";
  const empty = thread.querySelector(".empty"); if (empty) empty.remove();
  if (S.phase === "idle" && !INJECTION.test(t)) Actions.opener(t); else Actions.free(t);
});
$("#vPatient").onclick = () => setWin("patient");
$("#vClin").onclick = () => setWin("clinician");
$("#viewClin").onclick = () => { viewAI = false; $("#viewClin").setAttribute("aria-pressed", "true"); $("#viewAI").setAttribute("aria-pressed", "false"); seen = new Set(); renderConsole(); };
$("#tabDash").onclick = () => setClinTab("dash");
$("#tabInbox").onclick = () => setClinTab("inbox");
$("#nightbtn").onclick = () => { const on = !document.body.classList.contains("night"); document.body.classList.toggle("night", on); $("#nightbtn").setAttribute("aria-pressed", on); try { localStorage.setItem("cp-night", on ? "1" : ""); } catch (e) {} };
try { if (localStorage.getItem("cp-night")) { document.body.classList.add("night"); $("#nightbtn").setAttribute("aria-pressed", "true"); } } catch (e) {}
// Clinician shortcuts: ⌘/Ctrl Enter signs, E edits the draft, V switches or starts video, R refers in person.
document.addEventListener("keydown", e => {
  if (win === "patient" || e.altKey) return;
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  const btn = sel => { const b = $(sel); if (b && !b.disabled) { e.preventDefault(); b.click(); } };
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { const b = $("#signbtn"); if (b && !b.disabled) { e.preventDefault(); Doctor.approve(); } return; }
  if (typing || e.metaKey || e.ctrlKey) return;
  const k = e.key.toLowerCase();
  const find = label => [...document.querySelectorAll("#actions button")].find(b => b.textContent.toLowerCase().includes(label));
  const go = b => { if (b && !b.disabled) { e.preventDefault(); b.click(); } };
  if (k === "e") go(find("edit") || find("done editing"));
  else if (k === "v") go(find("video"));
  else if (k === "r") go(find("refer"));
});
$("#viewAI").onclick = () => { viewAI = true; $("#viewAI").setAttribute("aria-pressed", "true"); $("#viewClin").setAttribute("aria-pressed", "false"); seen = new Set(); renderConsole(); };
document.addEventListener("keydown", e => {
  if (/^Digit[1-6]$/.test(e.code) && !e.altKey && !e.metaKey && !e.ctrlKey && !/INPUT|TEXTAREA/.test(document.activeElement.tagName) && win === "patient") {
    const w = lastWidget(); const o = w && w.matches("[data-ask]") && w.querySelectorAll(".askopt")[+e.code.slice(5) - 1]; if (o) o.click();
  }
});
$("#play").onclick = () => { if (playing) { reset(); return; } autoplay("video"); };
$("#pausebtn").onclick = () => { if (playing) setPaused(!paused); };
$("#resetbtn").onclick = $("#topreset").onclick = () => { setWin("patient"); reset(); };

reset();
(async function checkLive() {
  try {
    const r = await fetch("/api/health", { cache: "no-store" });
    const j = await r.json();
    liveAvailable = !!j.live; apiModel = j.model;
  } catch (e) { liveAvailable = false; }
  if (S.phase === "idle" && !S.complaint) reset(); else modelLabel();
})();
</script>
